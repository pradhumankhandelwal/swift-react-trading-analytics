name: TradingAnalytics

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  TradingAnalytics:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
      # A folder reference, not a group. A group import flattens the directory and
      # Bundle.main.url(forResource: "web", withExtension: nil) then returns nil.
      # The path must exist when `xcodegen generate` runs, so `make gen` builds the
      # web app first.
      - path: ios/Resources/web
        type: folder
        buildPhase: resources
    info:
      # Generated by XcodeGen from the properties below on every `xcodegen generate`.
      # Do not hand-edit this file; edit these properties instead.
      path: ios/Generated/Info.plist
      properties:
        CFBundleDisplayName: Hello World
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # Scoped to localhost, for the Vite dev server. It ships in Release too, which is
          # harmless: DEV_SERVER_URL is behind #if DEBUG, so a Release build cannot reach a
          # dev server at all. No NSAllowsArbitraryLoads.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TradingAnalytics
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
